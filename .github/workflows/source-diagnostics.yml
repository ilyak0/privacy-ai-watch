name: Source diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  noyb:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r requirements.txt
      - name: Read official noyb listing without credentials
        run: |
          python3 - <<'PY'
          import json
          from collections import Counter
          from bs4 import BeautifulSoup
          from collect import fetch
          url = 'https://noyb.eu/en/news'
          try:
              data, kind = fetch(url)
          except Exception as exc:
              print(json.dumps({'url': url, 'error_type': type(exc).__name__,
                                'reason': str(exc)[:220]}))
              raise SystemExit(1)
          soup = BeautifulSoup(data, 'html.parser')
          print(json.dumps({'url': url, 'content_type': kind, 'bytes': len(data),
              'listing_rows': len(soup.select('.views-row')),
              'dates': len(soup.select('time[datetime]')),
              'h1': [n.get_text(' ', strip=True) for n in soup.select('h1')]}))
          for row in soup.select('.views-row')[:2]:
              print(json.dumps({'tag': row.name, 'class': row.get('class'),
                  'headings': [{'tag': n.name, 'class': n.get('class'),
                      'text': n.get_text(' ', strip=True)[:120]} for n in row.select('h2,h3')],
                  'times': [dict(n.attrs) for n in row.select('time')],
                  'links': [{'href': n.get('href'), 'class': n.get('class')}
                            for n in row.select('a[href]')][:4]}, ensure_ascii=False))
          if not soup.select('.views-row'):
              print(json.dumps({'common_classes': Counter(c for n in soup.find_all(True)
                  for c in n.get('class', [])).most_common(16)}))
          PY
